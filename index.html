<!DOCTYPE html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#153d33" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/jpeg" href="%BASE_URL%favicon.jpg" />
    <title>Portafolio profesional</title>
    <script>
      (function (location) {
        if (location.search.startsWith("?/")) {
          var decoded = location.search.slice(2).split("&").map(function (part) {
            return part.replace(/~and~/g, "&");
          }).join("?");
          window.history.replaceState(null, "", location.pathname + decoded + location.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Necesitas habilitar JavaScript para navegar por este portafolio.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
